<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shark</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #040d1a;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .back {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      color: rgba(255,255,255,0.3);
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      text-decoration: none;
      transition: color 0.15s;
    }
    .back:hover { color: rgba(255,255,255,0.7); }

    /* Food menu */
    #food-menu {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      font-family: ui-monospace, monospace;
    }

    .food-options {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.25s ease, opacity 0.2s ease;
      opacity: 0;
    }
    .food-options.open {
      max-height: 200px;
      opacity: 1;
    }

    .food-btn {
      background: rgba(10, 20, 40, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      border-radius: 20px;
      padding: 0.4rem 0.9rem;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .food-btn:hover {
      border-color: rgba(91,141,238,0.6);
      color: #fff;
    }
    .food-btn.active {
      background: rgba(91,141,238,0.25);
      border-color: #5b8dee;
      color: #fff;
    }

    .menu-toggle {
      background: rgba(10, 20, 40, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      border-radius: 20px;
      padding: 0.45rem 1rem;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: border-color 0.15s, color 0.15s;
    }
    .menu-toggle:hover {
      border-color: rgba(91,141,238,0.6);
      color: #fff;
    }
    .menu-toggle.feeding {
      border-color: #5b8dee;
      color: #5b8dee;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← back</a>
  <canvas id="c"></canvas>

  <div id="food-menu">
    <div class="food-options" id="food-options">
      <button class="food-btn" id="btn-fish" onclick="selectFood('fish')">🐟 fish</button>
      <button class="food-btn" id="btn-plankton" onclick="selectFood('plankton')">🦐 plankton</button>
      <button class="food-btn" id="btn-none" onclick="selectFood(null)">✕ chase mode</button>
    </div>
    <button class="menu-toggle" id="menu-toggle" onclick="toggleMenu()">feed ▾</button>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ── Sprites ──────────────────────────────────────────────────────────────

    const SPRITE_DEFS = [
      { src: 'shark-sprite.png',    w: 220, h: 120, tilt:  16 * Math.PI / 180, flip: true  }, // hammerhead
      { src: 'shark2-sprite.png',   w: 220, h: 120, tilt:  16 * Math.PI / 180, flip: true  }, // great white
      { src: 'shark3-sprite.png',   w: 155, h: 155, tilt: -Math.PI / 2,        flip: false }, // manta ray
      { src: 'shark4-sprite.png',   w: 250, h: 136, tilt:  10 * Math.PI / 180, flip: true  }, // whale shark
    ];

    const FOOD_SPRITE_DEFS = {
      fish:     { src: 'food-fish.png',     w: 48, h: 48 },
      plankton: { src: 'food-plankton.png', w: 48, h: 48 },
    };

    function loadSprite(def) {
      const img = new Image();
      img.src = def.src;
      const s = { img, loaded: false, ...def };
      img.onload = () => { s.loaded = true; };
      return s;
    }

    const sprites = SPRITE_DEFS.map(loadSprite);
    const foodSprites = {
      fish:     loadSprite(FOOD_SPRITE_DEFS.fish),
      plankton: loadSprite(FOOD_SPRITE_DEFS.plankton),
    };

    // ── Creatures ─────────────────────────────────────────────────────────────
    // diet: which food types attract this creature
    const creatures = [
      { x: 0, y: 0, tx: null, ty: null, angle: 0,               speed: 3, idleSpeed: 1.5, sprite: sprites[0], diet: ['fish'],     foodTarget: null },
      { x: 0, y: 0, tx: null, ty: null, angle: Math.PI / 2,     speed: 3, idleSpeed: 1.5, sprite: sprites[1], diet: ['fish'],     foodTarget: null },
      { x: 0, y: 0, tx: null, ty: null, angle: Math.PI,         speed: 3, idleSpeed: 1.5, sprite: sprites[2], diet: ['plankton'], foodTarget: null },
      { x: 0, y: 0, tx: null, ty: null, angle: 3 * Math.PI / 2, speed: 3, idleSpeed: 1.5, sprite: sprites[3], diet: ['plankton'], foodTarget: null },
    ];

    // ── Food ─────────────────────────────────────────────────────────────────

    const foods = []; // { x, y, type, alpha }
    const EAT_DIST = 40;

    function dropFood(x, y) {
      foods.push({ x, y, type: selectedFood, alpha: 1 });
    }

    function nearestFood(creature) {
      let best = null, bestDist = Infinity;
      for (const f of foods) {
        if (!creature.diet.includes(f.type)) continue;
        const dx = f.x - creature.x, dy = f.y - creature.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < bestDist) { bestDist = d; best = f; }
      }
      return best;
    }

    // ── Hint ─────────────────────────────────────────────────────────────────

    let hintAlpha = 1;
    let hintFaded = false;

    // ── Input ────────────────────────────────────────────────────────────────

    let lastInputTime = 0;
    const IDLE_DELAY = 2000;
    let selectedFood = null;
    let menuOpen = false;

    function toggleMenu() {
      menuOpen = !menuOpen;
      document.getElementById('food-options').classList.toggle('open', menuOpen);
    }

    function selectFood(type) {
      selectedFood = type;
      menuOpen = false;
      document.getElementById('food-options').classList.remove('open');
      // Update button states
      ['fish', 'plankton'].forEach(t => {
        document.getElementById(`btn-${t}`).classList.toggle('active', type === t);
      });
      document.getElementById('btn-none').classList.toggle('active', type === null);
      const toggle = document.getElementById('menu-toggle');
      if (type === 'fish')     { toggle.textContent = '🐟 fish ▾'; toggle.classList.add('feeding'); }
      else if (type === 'plankton') { toggle.textContent = '🦐 plankton ▾'; toggle.classList.add('feeding'); }
      else                     { toggle.textContent = 'feed ▾'; toggle.classList.remove('feeding'); }
    }

    function handleTap(x, y, ripple) {
      hintFaded = true;
      if (selectedFood) {
        dropFood(x, y);
        if (ripple) {
          for (let i = 0; i < 3; i++)
            ripples.push({ x, y, r: 15 + i * 6, alpha: 1, delay: i * 18 });
        }
      } else {
        lastInputTime = performance.now();
        creatures.forEach(c => { c.tx = x; c.ty = y; c.foodTarget = null; });
        if (ripple) {
          for (let i = 0; i < 3; i++)
            ripples.push({ x, y, r: 15 + i * 6, alpha: 1, delay: i * 18 });
        }
      }
    }

    canvas.addEventListener('click', e => {
      if (menuOpen) { toggleMenu(); return; }
      handleTap(e.clientX, e.clientY, true);
    });
    canvas.addEventListener('mousemove', e => {
      if (selectedFood) return; // don't chase mouse in feed mode
      lastInputTime = performance.now();
      creatures.forEach(c => { c.tx = e.clientX; c.ty = e.clientY; c.foodTarget = null; });
    });
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (menuOpen) { toggleMenu(); return; }
      const t = e.touches[0];
      handleTap(t.clientX, t.clientY, true);
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (selectedFood) return;
      lastInputTime = performance.now();
      const t = e.touches[0];
      creatures.forEach(c => { c.tx = t.clientX; c.ty = t.clientY; c.foodTarget = null; });
    }, { passive: false });

    // ── Ripples ───────────────────────────────────────────────────────────────

    const ripples = [];

    // ── Init ─────────────────────────────────────────────────────────────────

    function init() {
      creatures[0].x = W * 0.25; creatures[0].y = H * 0.35;
      creatures[1].x = W * 0.75; creatures[1].y = H * 0.35;
      creatures[2].x = W * 0.25; creatures[2].y = H * 0.65;
      creatures[3].x = W * 0.75; creatures[3].y = H * 0.65;
      creatures.forEach(c => { c.tx = null; c.ty = null; c.foodTarget = null; });
    }
    init();

    function pickWanderTarget(c) {
      const margin = 0.15;
      const mx = W * margin, my = H * margin;
      c.tx = mx + Math.random() * (W - mx * 2);
      c.ty = my + Math.random() * (H - my * 2);
    }

    // ── Movement ──────────────────────────────────────────────────────────────

    function moveCreature(c, ts) {
      const idle = ts - lastInputTime > IDLE_DELAY;

      // Find nearest edible food
      const food = nearestFood(c);
      if (food) {
        c.foodTarget = food;
        c.tx = food.x;
        c.ty = food.y;
      } else if (c.foodTarget && !foods.includes(c.foodTarget)) {
        // Food was eaten — clear and wander
        c.foodTarget = null;
        c.tx = null;
        c.ty = null;
      }

      // Idle wander when no touch target and no food
      if (c.tx === null && (idle || selectedFood)) {
        pickWanderTarget(c);
      }

      if (c.tx === null) return;

      const dx = c.tx - c.x;
      const dy = c.ty - c.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const spd = (c.foodTarget || !idle) ? c.speed : c.idleSpeed;

      if (dist < c.idleSpeed) {
        c.x = c.tx; c.y = c.ty;

        // Eat food if close enough
        if (c.foodTarget && dist < EAT_DIST) {
          const idx = foods.indexOf(c.foodTarget);
          if (idx !== -1) foods.splice(idx, 1);
          c.foodTarget = null;
        }

        c.tx = null; c.ty = null;
        if (idle || selectedFood) pickWanderTarget(c);
      } else {
        const targetAngle = Math.atan2(dy, dx);
        let da = targetAngle - c.angle;
        while (da > Math.PI) da -= 2 * Math.PI;
        while (da < -Math.PI) da += 2 * Math.PI;
        c.angle += da * 0.12;
        c.x += Math.cos(c.angle) * spd;
        c.y += Math.sin(c.angle) * spd;

        // Eat when close enough mid-path
        if (c.foodTarget) {
          const fdx = c.foodTarget.x - c.x, fdy = c.foodTarget.y - c.y;
          if (Math.sqrt(fdx*fdx + fdy*fdy) < EAT_DIST) {
            const idx = foods.indexOf(c.foodTarget);
            if (idx !== -1) foods.splice(idx, 1);
            c.foodTarget = null;
            c.tx = null; c.ty = null;
          }
        }
      }
    }

    // ── Drawing ───────────────────────────────────────────────────────────────

    function drawCreature(c) {
      const s = c.sprite;
      if (!s.loaded) return;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.angle - s.tilt);
      if (s.flip) ctx.scale(-1, 1);
      ctx.drawImage(s.img, -s.w / 2, -s.h / 2, s.w, s.h);
      ctx.restore();
    }

    function drawFood(f) {
      const s = foodSprites[f.type];
      if (s && s.loaded) {
        ctx.save();
        ctx.globalAlpha = f.alpha;
        ctx.drawImage(s.img, f.x - s.w / 2, f.y - s.h / 2, s.w, s.h);
        ctx.restore();
      } else {
        // Placeholder until sprites are loaded
        ctx.save();
        ctx.globalAlpha = f.alpha;
        ctx.fillStyle = f.type === 'fish' ? '#f4a261' : '#80b918';
        ctx.beginPath();
        ctx.arc(f.x, f.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawRipple(r) {
      ctx.save();
      ctx.strokeStyle = `rgba(100, 180, 255, ${r.alpha})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawHint() {
      if (hintAlpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = hintAlpha;
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '14px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('tap anywhere', W / 2, H - 40);
      ctx.restore();
    }

    // ── Loop ──────────────────────────────────────────────────────────────────

    let last = 0;
    function frame(ts) {
      const dt = Math.min(ts - last, 50);
      last = ts;

      ctx.clearRect(0, 0, W, H);

      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#040d1a');
      grad.addColorStop(1, '#0a1f3a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      creatures.forEach(c => moveCreature(c, ts));

      foods.forEach(drawFood);

      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        if (r.delay > 0) { r.delay--; continue; }
        drawRipple(r);
        r.r += 1.3;
        r.alpha -= 0.02;
        if (r.alpha <= 0) ripples.splice(i, 1);
      }

      creatures.forEach(drawCreature);

      if (!hintFaded) {
        drawHint();
      } else if (hintAlpha > 0) {
        hintAlpha = Math.max(0, hintAlpha - 0.03);
        drawHint();
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
