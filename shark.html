<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shark</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #040d1a;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .back {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      color: rgba(255,255,255,0.3);
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      text-decoration: none;
      transition: color 0.15s;
    }

    .back:hover { color: rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <a href="index.html" class="back">← back</a>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Sprite definitions: { src, tilt (rad), flip }
    const SPRITE_DEFS = [
      { src: 'shark-sprite.png',  tilt: 16 * Math.PI / 180, flip: true },
      { src: 'shark2-sprite.png', tilt: 16 * Math.PI / 180, flip: true },
    ];

    const SHARK_W = 220;
    const SHARK_H = Math.round(SHARK_W * (768 / 1408)); // ~120px

    // Load all sprite images
    const sprites = SPRITE_DEFS.map(def => {
      const img = new Image();
      img.src = def.src;
      return { img, loaded: false, tilt: def.tilt, flip: def.flip };
    });
    sprites.forEach(s => { s.img.onload = () => { s.loaded = true; }; });

    // Sharks — staggered start positions
    const sharks = [
      { x: 0, y: 0, tx: null, ty: null, angle: 0,          speed: 3, idleSpeed: 1.5, sprite: sprites[0] },
      { x: 0, y: 0, tx: null, ty: null, angle: Math.PI / 2, speed: 3, idleSpeed: 1.5, sprite: sprites[1] },
    ];

    // Hint state
    let hintAlpha = 1;
    let hintFaded = false;

    // Input state
    let lastInputTime = 0;
    let touchTarget = null; // { x, y } when user is actively touching
    const IDLE_DELAY = 2000;

    const ripples = [];

    function init() {
      sharks[0].x = W * 0.35; sharks[0].y = H / 2;
      sharks[1].x = W * 0.65; sharks[1].y = H / 2;
      sharks.forEach(s => { s.tx = null; s.ty = null; });
    }
    init();
    window.addEventListener('resize', () => {});

    function pickWanderTarget(shark) {
      const margin = 0.15;
      const mx = W * margin, my = H * margin;
      shark.tx = mx + Math.random() * (W - mx * 2);
      shark.ty = my + Math.random() * (H - my * 2);
    }

    function setTarget(cx, cy, ripple = false) {
      lastInputTime = performance.now();
      touchTarget = { x: cx, y: cy };
      sharks.forEach(s => { s.tx = cx; s.ty = cy; });
      if (ripple) {
        for (let i = 0; i < 3; i++) {
          ripples.push({ x: cx, y: cy, r: 15 + i * 6, alpha: 1, delay: i * 18 });
        }
      }
      hintFaded = true;
    }

    function clearTouch() {
      touchTarget = null;
    }

    canvas.addEventListener('click', e => setTarget(e.clientX, e.clientY, true));
    canvas.addEventListener('mousemove', e => setTarget(e.clientX, e.clientY, false));
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      setTarget(t.clientX, t.clientY, true);
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      setTarget(t.clientX, t.clientY, false);
    }, { passive: false });
    canvas.addEventListener('touchend', clearTouch, { passive: true });
    canvas.addEventListener('touchcancel', clearTouch, { passive: true });

    function drawShark(shark) {
      const s = shark.sprite;
      if (!s.loaded) return;
      ctx.save();
      ctx.translate(shark.x, shark.y);
      ctx.rotate(shark.angle - s.tilt);
      if (s.flip) ctx.scale(-1, 1);
      ctx.drawImage(s.img, -SHARK_W / 2, -SHARK_H / 2, SHARK_W, SHARK_H);
      ctx.restore();
    }

    function moveShark(shark, ts) {
      const idle = ts - lastInputTime > IDLE_DELAY;

      if (shark.tx === null && idle) {
        pickWanderTarget(shark);
      }

      if (shark.tx !== null) {
        const dx = shark.tx - shark.x;
        const dy = shark.ty - shark.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const spd = idle ? shark.idleSpeed : shark.speed;

        if (dist < shark.idleSpeed) {
          shark.x = shark.tx; shark.y = shark.ty;
          shark.tx = null; shark.ty = null;
          if (idle) pickWanderTarget(shark);
        } else {
          const targetAngle = Math.atan2(dy, dx);
          let da = targetAngle - shark.angle;
          while (da > Math.PI) da -= 2 * Math.PI;
          while (da < -Math.PI) da += 2 * Math.PI;
          shark.angle += da * 0.12;
          shark.x += Math.cos(shark.angle) * spd;
          shark.y += Math.sin(shark.angle) * spd;
        }
      }
    }

    function drawRipple(r) {
      ctx.save();
      ctx.strokeStyle = `rgba(100, 180, 255, ${r.alpha})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawHint() {
      if (hintAlpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = hintAlpha;
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '14px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('tap anywhere', W / 2, H - 40);
      ctx.restore();
    }

    let last = 0;
    function frame(ts) {
      const dt = Math.min(ts - last, 50);
      last = ts;

      ctx.clearRect(0, 0, W, H);

      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#040d1a');
      grad.addColorStop(1, '#0a1f3a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      sharks.forEach(s => moveShark(s, ts));

      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        if (r.delay > 0) { r.delay--; continue; }
        drawRipple(r);
        r.r += 1.3;
        r.alpha -= 0.02;
        if (r.alpha <= 0) ripples.splice(i, 1);
      }

      sharks.forEach(drawShark);

      if (!hintFaded) {
        drawHint();
      } else if (hintAlpha > 0) {
        hintAlpha = Math.max(0, hintAlpha - 0.03);
        drawHint();
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
