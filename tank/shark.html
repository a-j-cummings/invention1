<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Shark Tank</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shark Tank">
  <meta name="theme-color" content="#040d1a">
  <link rel="manifest" href="/tank/manifest.json">
  <link rel="apple-touch-icon" href="/tank/icon-180.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #040d1a;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .back {
      position: fixed;
      top: calc(1.25rem + env(safe-area-inset-top));
      left: calc(1.25rem + env(safe-area-inset-left));
      color: rgba(255,255,255,0.3);
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      text-decoration: none;
      transition: color 0.15s;
    }
    .back:hover { color: rgba(255,255,255,0.7); }

    /* Food menu */
    #food-menu {
      position: fixed;
      top: calc(1.25rem + env(safe-area-inset-top));
      right: calc(1.5rem + env(safe-area-inset-right));
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
      font-family: ui-monospace, monospace;
    }

    .food-options {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.25s ease, opacity 0.2s ease;
      opacity: 0;
    }
    .food-options.open {
      max-height: 200px;
      opacity: 1;
    }

    .food-btn {
      background: rgba(10, 20, 40, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      border-radius: 20px;
      padding: 0.4rem 0.9rem;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .food-btn:hover {
      border-color: rgba(91,141,238,0.6);
      color: #fff;
    }
    .food-btn.active {
      background: rgba(91,141,238,0.25);
      border-color: #5b8dee;
      color: #fff;
    }

    .menu-toggle {
      background: rgba(10, 20, 40, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      border-radius: 20px;
      padding: 0.45rem 1rem;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: border-color 0.15s, color 0.15s;
    }
    .menu-toggle:hover {
      border-color: rgba(91,141,238,0.6);
      color: #fff;
    }
    .menu-toggle.feeding {
      border-color: #5b8dee;
      color: #5b8dee;
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back">← back</a>
  <canvas id="c"></canvas>

  <div id="food-menu">
    <button class="menu-toggle" id="menu-toggle" onclick="toggleMenu()">feed ▾</button>
    <div class="food-options" id="food-options">
      <button class="food-btn" id="btn-fish" onclick="selectFood('fish')">fish</button>
      <button class="food-btn" id="btn-plankton" onclick="selectFood('plankton')">plankton</button>
      <button class="food-btn" id="btn-seal" onclick="selectFood('seal')">seal</button>
      <button class="food-btn" id="btn-none" onclick="selectFood(null)">✕ none</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
      W = canvas.width = canvas.clientWidth;
      H = canvas.height = canvas.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ── Sprites ──────────────────────────────────────────────────────────────

    const SPRITE_DEFS = [
      { src: 'shark-sprite.png',    w: 220, h: 120, tilt:  16 * Math.PI / 180, flip: true  }, // hammerhead
      { src: 'shark2-sprite.png',   w: 220, h: 120, tilt:  16 * Math.PI / 180, flip: true  }, // great white
      { src: 'shark3-sprite.png',   w: 155, h: 155, tilt: -Math.PI / 2,        flip: false }, // manta ray
      { src: 'shark4-sprite.png',   w: 250, h: 136, tilt:  10 * Math.PI / 180, flip: true  }, // whale shark
    ];

    // SVG food icons loaded as Image objects — reliable on all platforms
    const FOOD_SVGs = {
      fish: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
        <!-- tail -->
        <polygon points="48,4 48,28 34,16" fill="#e07c3a"/>
        <!-- body -->
        <ellipse cx="20" cy="16" rx="18" ry="11" fill="#f4a261"/>
        <!-- belly -->
        <ellipse cx="18" cy="18" rx="12" ry="6" fill="#fdd9b5"/>
        <!-- eye -->
        <circle cx="9" cy="13" r="3" fill="#fff"/>
        <circle cx="9" cy="13" r="1.5" fill="#222"/>
        <!-- fin -->
        <polygon points="14,5 22,5 18,11" fill="#e07c3a"/>
      </svg>`,

      plankton: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48">
        <!-- body segments -->
        <ellipse cx="20" cy="30" rx="9" ry="11" fill="#80c784"/>
        <ellipse cx="20" cy="20" rx="7" ry="7" fill="#a5d6a7"/>
        <ellipse cx="20" cy="12" rx="5" ry="5" fill="#c8e6c9"/>
        <!-- antennae -->
        <line x1="20" y1="8" x2="10" y2="1" stroke="#558b5e" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="20" y1="8" x2="30" y2="1" stroke="#558b5e" stroke-width="1.5" stroke-linecap="round"/>
        <!-- legs -->
        <line x1="13" y1="28" x2="4"  y2="34" stroke="#558b5e" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="13" y1="32" x2="3"  y2="40" stroke="#558b5e" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="27" y1="28" x2="36" y2="34" stroke="#558b5e" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="27" y1="32" x2="37" y2="40" stroke="#558b5e" stroke-width="1.5" stroke-linecap="round"/>
        <!-- eye -->
        <circle cx="17" cy="11" r="1.5" fill="#333"/>
      </svg>`,

      seal: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 36">
        <!-- tail flippers -->
        <ellipse cx="57" cy="12" rx="7" ry="3.5" fill="#7a8b98" transform="rotate(-25 57 12)"/>
        <ellipse cx="57" cy="24" rx="7" ry="3.5" fill="#7a8b98" transform="rotate(25 57 24)"/>
        <!-- body -->
        <ellipse cx="32" cy="20" rx="24" ry="12" fill="#9ab0bc"/>
        <!-- belly -->
        <ellipse cx="28" cy="22" rx="16" ry="7" fill="#c8d8e0"/>
        <!-- head -->
        <ellipse cx="10" cy="17" rx="10" ry="9" fill="#aabfca"/>
        <!-- front flipper -->
        <ellipse cx="26" cy="30" rx="10" ry="4" fill="#7a8b98" transform="rotate(-15 26 30)"/>
        <!-- eye -->
        <circle cx="7"  cy="14" r="3"   fill="#1a1a2e"/>
        <circle cx="6"  cy="13" r="1"   fill="#fff"/>
        <!-- nose -->
        <ellipse cx="3" cy="18" rx="2.5" ry="1.5" fill="#7a8b98"/>
        <!-- whiskers -->
        <line x1="3" y1="17" x2="-4" y2="15" stroke="#ccc" stroke-width="0.8"/>
        <line x1="3" y1="18" x2="-4" y2="18" stroke="#ccc" stroke-width="0.8"/>
        <line x1="3" y1="19" x2="-4" y2="21" stroke="#ccc" stroke-width="0.8"/>
      </svg>`,
    };

    const FOOD_SIZE = { fish: { w: 48, h: 32 }, plankton: { w: 40, h: 48 } };

    function makeFoodImage(svgStr) {
      const img = new Image();
      img.src = 'data:image/svg+xml,' + encodeURIComponent(svgStr);
      const obj = { img, loaded: false };
      img.onload = () => { obj.loaded = true; };
      return obj;
    }

    const foodImgs = {
      fish:     makeFoodImage(FOOD_SVGs.fish),
      plankton: makeFoodImage(FOOD_SVGs.plankton),
    };

    // Seal — a moving prey that tries to flee the great white
    const SEAL_W = 64, SEAL_H = 36;
    const SEAL_SPEED = 2;        // slower than great white (speed 3)
    const SEAL_FLEE_RADIUS = 220;
    const sealImg = makeFoodImage(FOOD_SVGs.seal);
    const seals = []; // { x, y, angle, tx, ty }

    function loadSprite(def) {
      const img = new Image();
      img.src = def.src;
      const s = { img, loaded: false, ...def };
      img.onload = () => { s.loaded = true; };
      return s;
    }

    const sprites = SPRITE_DEFS.map(loadSprite);

    // ── Creatures ─────────────────────────────────────────────────────────────
    // diet: which food types attract this creature
    const creatures = [
      { x: 0, y: 0, tx: null, ty: null, angle: 0,               speed: 3, idleSpeed: 1.5, sprite: sprites[0], diet: ['fish'],     foodTarget: null },
      { x: 0, y: 0, tx: null, ty: null, angle: Math.PI / 2,     speed: 3, idleSpeed: 1.5, sprite: sprites[1], diet: ['fish'],     foodTarget: null, isSealHunter: true },
      { x: 0, y: 0, tx: null, ty: null, angle: Math.PI,         speed: 3, idleSpeed: 1.5, sprite: sprites[2], diet: ['plankton'], foodTarget: null },
      { x: 0, y: 0, tx: null, ty: null, angle: 3 * Math.PI / 2, speed: 3, idleSpeed: 1.5, sprite: sprites[3], diet: ['plankton'], foodTarget: null },
    ];
    const greatWhite = creatures[1];

    // ── Food ─────────────────────────────────────────────────────────────────

    const foods = []; // { x, y, angle, tx, ty, type, alpha }
    const EAT_DIST = 55;
    const FOOD_FLEE_RADIUS = 160;
    const FOOD_SPEED = { fish: 2.0, plankton: 1.3 };

    function dropFood(x, y) {
      if (selectedFood === 'seal') {
        seals.push({ x, y, angle: Math.random() * Math.PI * 2, tx: null, ty: null });
      } else {
        foods.push({ x, y, type: selectedFood, alpha: 1, angle: Math.random() * Math.PI * 2, tx: null, ty: null });
      }
    }

    function moveFood(f) {
      const margin = 0.06;
      const mx = W * margin, my = H * margin;

      // Find nearest predator for this food type
      let nearest = null, nearestD = Infinity;
      for (const c of creatures) {
        if (!c.diet.includes(f.type)) continue;
        const d = Math.hypot(c.x - f.x, c.y - f.y);
        if (d < nearestD) { nearestD = d; nearest = c; }
      }

      if (nearest && nearestD < FOOD_FLEE_RADIUS) {
        const dx = f.x - nearest.x, dy = f.y - nearest.y;
        const len = nearestD || 1;
        f.tx = Math.max(mx, Math.min(W - mx, f.x + (dx / len) * 200));
        f.ty = Math.max(my, Math.min(H - my, f.y + (dy / len) * 200));
      } else if (f.tx === null) {
        f.tx = mx + Math.random() * (W - mx * 2);
        f.ty = my + Math.random() * (H - my * 2);
      }

      steer(f, FOOD_SPEED[f.type]);
      f.x = Math.max(mx, Math.min(W - mx, f.x));
      f.y = Math.max(my, Math.min(H - my, f.y));
    }

    function nearestFood(creature) {
      let best = null, bestDist = Infinity;
      for (const f of foods) {
        if (!creature.diet.includes(f.type)) continue;
        const dx = f.x - creature.x, dy = f.y - creature.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < bestDist) { bestDist = d; best = f; }
      }
      return best;
    }

    // ── Hint ─────────────────────────────────────────────────────────────────

    let hintAlpha = 1;
    let hintFaded = false;

    // ── Input ────────────────────────────────────────────────────────────────

    let lastInputTime = 0;
    const IDLE_DELAY = 2000;
    let selectedFood = null;
    let menuOpen = false;

    function toggleMenu() {
      menuOpen = !menuOpen;
      document.getElementById('food-options').classList.toggle('open', menuOpen);
    }

    function selectFood(type) {
      selectedFood = type;
      menuOpen = false;
      document.getElementById('food-options').classList.remove('open');
      // Update button states
      ['fish', 'plankton', 'seal'].forEach(t => {
        document.getElementById(`btn-${t}`).classList.toggle('active', type === t);
      });
      document.getElementById('btn-none').classList.toggle('active', type === null);
      const toggle = document.getElementById('menu-toggle');
      const labels = { fish: 'fish ▾', plankton: 'plankton ▾', seal: 'seal ▾' };
      if (type) { toggle.textContent = labels[type]; toggle.classList.add('feeding'); }
      else      { toggle.textContent = 'feed ▾'; toggle.classList.remove('feeding'); }
    }

    function handleTap(x, y, ripple) {
      hintFaded = true;
      dropFood(x, y);
      if (ripple) {
        for (let i = 0; i < 3; i++)
          ripples.push({ x, y, r: 15 + i * 6, alpha: 1, delay: i * 18 });
      }
    }

    canvas.addEventListener('click', e => {
      if (menuOpen) { toggleMenu(); return; }
      if (selectedFood) handleTap(e.clientX, e.clientY, true);
    });
    canvas.addEventListener('mousemove', e => {
      // no chasing in any mode — food only
    });
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (menuOpen) { toggleMenu(); return; }
      if (selectedFood) {
        const t = e.touches[0];
        handleTap(t.clientX, t.clientY, true);
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      // no drag-chasing
    }, { passive: false });

    // ── Ripples ───────────────────────────────────────────────────────────────

    const ripples = [];

    // ── Init ─────────────────────────────────────────────────────────────────

    function init() {
      creatures[0].x = W * 0.25; creatures[0].y = H * 0.35;
      creatures[1].x = W * 0.75; creatures[1].y = H * 0.35;
      creatures[2].x = W * 0.25; creatures[2].y = H * 0.65;
      creatures[3].x = W * 0.75; creatures[3].y = H * 0.65;
      creatures.forEach(c => { c.tx = null; c.ty = null; c.foodTarget = null; });
    }
    init();

    function pickWanderTarget(c) {
      const margin = 0.15;
      const mx = W * margin, my = H * margin;
      c.tx = mx + Math.random() * (W - mx * 2);
      c.ty = my + Math.random() * (H - my * 2);
    }

    // ── Movement ──────────────────────────────────────────────────────────────

    // Shared steering — turn toward (tx,ty) and move at spd.
    // Turn rate scales up when close to target to avoid orbiting.
    function steer(entity, spd) {
      const dx = entity.tx - entity.x, dy = entity.ty - entity.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < spd) {
        entity.x = entity.tx; entity.y = entity.ty;
        entity.tx = null; entity.ty = null;
        return dist;
      }
      const targetAngle = Math.atan2(dy, dx);
      let da = targetAngle - entity.angle;
      while (da > Math.PI)  da -= 2 * Math.PI;
      while (da < -Math.PI) da += 2 * Math.PI;
      // Faster turning when the angle error is large (prevents orbiting)
      const turnRate = 0.12 + 0.15 * (Math.abs(da) / Math.PI);
      entity.angle += da * turnRate;
      // Normalize angle to prevent float drift
      while (entity.angle > Math.PI)  entity.angle -= 2 * Math.PI;
      while (entity.angle < -Math.PI) entity.angle += 2 * Math.PI;
      entity.x += Math.cos(entity.angle) * spd;
      entity.y += Math.sin(entity.angle) * spd;
      return dist;
    }

    function moveSeal(seal) {
      const margin = 0.08;
      const mx = W * margin, my = H * margin;

      // Flee from great white if close
      const dx = seal.x - greatWhite.x, dy = seal.y - greatWhite.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < SEAL_FLEE_RADIUS) {
        const len = dist || 1;
        seal.tx = Math.max(mx, Math.min(W - mx, seal.x + (dx / len) * 200));
        seal.ty = Math.max(my, Math.min(H - my, seal.y + (dy / len) * 200));
      } else if (seal.tx === null) {
        seal.tx = mx + Math.random() * (W - mx * 2);
        seal.ty = my + Math.random() * (H - my * 2);
      }

      steer(seal, SEAL_SPEED);

      // Keep in bounds
      seal.x = Math.max(mx, Math.min(W - mx, seal.x));
      seal.y = Math.max(my, Math.min(H - my, seal.y));
    }

    function moveCreature(c) {
      // Great white: chase nearest seal with priority, updated every frame
      if (c.isSealHunter && seals.length > 0) {
        let nearest = null, nearestD = Infinity;
        for (const s of seals) {
          const d = Math.hypot(s.x - c.x, s.y - c.y);
          if (d < nearestD) { nearestD = d; nearest = s; }
        }
        c.tx = nearest.x;
        c.ty = nearest.y;
        c.foodTarget = null;
        // Check eat
        if (nearestD < EAT_DIST) {
          seals.splice(seals.indexOf(nearest), 1);
          c.tx = null; c.ty = null;
        }
        if (c.tx !== null) steer(c, c.speed);
        return;
      }

      // Lock onto nearest edible food
      const food = nearestFood(c);
      if (food) {
        c.foodTarget = food;
        c.tx = food.x;
        c.ty = food.y;
      } else if (c.foodTarget && !foods.includes(c.foodTarget)) {
        c.foodTarget = null;
        c.tx = null;
        c.ty = null;
      }

      // Always wander when no target
      if (c.tx === null) {
        pickWanderTarget(c);
        return;
      }

      // Check eat distance
      if (c.foodTarget) {
        const dist = Math.hypot(c.tx - c.x, c.ty - c.y);
        if (dist < EAT_DIST) {
          const idx = foods.indexOf(c.foodTarget);
          if (idx !== -1) foods.splice(idx, 1);
          c.foodTarget = null;
          c.tx = null; c.ty = null;
          return;
        }
      }

      steer(c, c.foodTarget ? c.speed : c.idleSpeed);
    }

    // ── Drawing ───────────────────────────────────────────────────────────────

    function drawCreature(c) {
      const s = c.sprite;
      if (!s.loaded) return;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.angle - s.tilt);
      if (s.flip) ctx.scale(-1, 1);
      ctx.drawImage(s.img, -s.w / 2, -s.h / 2, s.w, s.h);
      ctx.restore();
    }

    function drawSeal(seal) {
      if (!sealImg.loaded) return;
      ctx.save();
      ctx.translate(seal.x, seal.y);
      ctx.rotate(seal.angle);
      ctx.scale(-1, 1); // SVG head is on left; flip so it faces direction of travel
      ctx.drawImage(sealImg.img, -SEAL_W / 2, -SEAL_H / 2, SEAL_W, SEAL_H);
      ctx.restore();
    }

    function drawFood(f) {
      const fi = foodImgs[f.type];
      if (!fi.loaded) return;
      const sz = FOOD_SIZE[f.type];
      ctx.save();
      ctx.globalAlpha = f.alpha;
      ctx.translate(f.x, f.y);
      ctx.rotate(f.angle);
      if (f.type === 'fish') ctx.scale(-1, 1); // fish SVG faces left, flip to face travel direction
      ctx.drawImage(fi.img, -sz.w / 2, -sz.h / 2, sz.w, sz.h);
      ctx.restore();
    }

    function drawRipple(r) {
      ctx.save();
      ctx.strokeStyle = `rgba(100, 180, 255, ${r.alpha})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawHint() {
      if (hintAlpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = hintAlpha;
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '14px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('open feed menu to start', W / 2, H - 40);
      ctx.restore();
    }

    // ── Loop ──────────────────────────────────────────────────────────────────

    let last = 0;
    function frame(ts) {
      const dt = Math.min(ts - last, 50);
      last = ts;

      ctx.clearRect(0, 0, W, H);

      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#040d1a');
      grad.addColorStop(1, '#0a1f3a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      foods.forEach(moveFood);
      seals.forEach(moveSeal);
      // Update creature food targets to track moving food each frame
      creatures.forEach(c => {
        if (c.foodTarget && foods.includes(c.foodTarget)) {
          c.tx = c.foodTarget.x;
          c.ty = c.foodTarget.y;
        }
      });
      creatures.forEach(c => moveCreature(c));

      seals.forEach(drawSeal);
      foods.forEach(drawFood);

      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        if (r.delay > 0) { r.delay--; continue; }
        drawRipple(r);
        r.r += 1.3;
        r.alpha -= 0.02;
        if (r.alpha <= 0) ripples.splice(i, 1);
      }

      creatures.forEach(drawCreature);

      if (!hintFaded) {
        drawHint();
      } else if (hintAlpha > 0) {
        hintAlpha = Math.max(0, hintAlpha - 0.03);
        drawHint();
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/tank/sw.js');
    }
  </script>
</body>
</html>
