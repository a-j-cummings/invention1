<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invention No. 1</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0f14;
      --surface: #151820;
      --border: #252a36;
      --text-primary: #e8eaf0;
      --text-secondary: #7a8099;
      --accent: #5b8dee;
      --accent-dim: #1e2a42;
    }

    :root.light {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #dde1ea;
      --text-primary: #1a1d27;
      --text-secondary: #6b7280;
      --accent: #2563eb;
      --accent-dim: #dbeafe;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: ui-monospace, "Cascadia Code", "SF Mono", "Menlo", "Consolas", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 520px;
      width: 100%;
    }

    .label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.6rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3ecf8e;
      flex-shrink: 0;
      box-shadow: 0 0 6px #3ecf8e88;
    }

    .meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.6;
      line-height: 1.7;
    }

    .meta span {
      color: var(--accent);
      opacity: 1;
    }

    .theme-btn {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .theme-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent);
    }

    body {
      transition: background-color 0.2s, color 0.2s;
    }

    .card {
      transition: background 0.2s, border-color 0.2s;
    }
  </style>
</head>
<body>
  <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☀ light</button>
  <div class="card">
    <div class="label">Invention No. 1</div>
    <h1>Claude Code<br>Remote Control</h1>
    <p class="subtitle">
      Experimenting with autonomous software engineering —
      a machine that writes, runs, and serves its own code.
    </p>
    <hr class="divider">
    <div class="status">
      <div class="dot"></div>
      Server running on local network
    </div>
    <div class="meta">
      <span>http://100.118.45.20:8080</span><br>
      branch: experiment/hosted-website<br>
      served by python3 http.server
    </div>
  </div>
  <script>
    function toggleTheme() {
      const isLight = document.documentElement.classList.toggle('light');
      document.getElementById('theme-btn').textContent = isLight ? '☽ dark' : '☀ light';
    }
  </script>
</body>
</html>
